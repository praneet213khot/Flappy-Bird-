<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flappy Score Challenge</title>
<style>
* { box-sizing: border-box; user-select: none; }
body {
  margin: 0; background: #0a0e17; color: #fff;
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; padding: 10px;
}
.wrap { width: min(540px, 100vw); text-align: center; display: flex; flex-direction: column; gap: 10px; }
h1 {
  margin: 4px 0 2px; font-size: 26px; font-weight: 800;
  background: linear-gradient(135deg, #ffd54a, #ff7100);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.controls { display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; }
#name {
  flex: 1; min-width: 140px; padding: 10px 14px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.15); background: rgba(255, 255, 255, 0.07);
  color: #fff; font-size: 15px; outline: none;
}
button {
  padding: 10px 14px; border: none; border-radius: 12px;
  font-weight: 700; font-size: 14px; cursor: pointer;
  transition: transform 0.1s ease;
}
button:active { transform: scale(0.95); }
#start { background: linear-gradient(135deg, #4caf50, #2e7d32); color: #fff; }
#restartBtn { background: linear-gradient(135deg, #f44336, #c62828); color: #fff; }
#scoreBtn { background: linear-gradient(135deg, #ff9800, #f57c00); color: #fff; }
#status { min-height: 22px; color: #ffd54a; font-weight: 600; font-size: 14px; }
.timerBox {
  font-size: 13px; font-weight: 700; color: #8ed8ff;
  background: rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 6px;
}
canvas {
  width: 100%; max-width: 540px; background: #8ed8ff; border-radius: 18px;
  display: block; margin: auto; touch-action: none;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
}
.board {
  background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 18px; padding: 14px; backdrop-filter: blur(12px);
}
.board h2 { margin: 0 0 10px; font-size: 17px; color: #ffd54a; }
.row { display: flex; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 14px; }
.small { font-size: 11px; color: #888; margin-top: 6px; }
.modal {
  display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
  z-index: 20; align-items: center; justify-content: center; padding: 20px;
}
.modalBox {
  position: relative; width: min(420px, 94vw); max-height: 80vh; overflow: auto;
  background: #141a26; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 20px;
}
.close { position: absolute; right: 12px; top: 12px; background: rgba(255, 255, 255, 0.1); color: #fff; padding: 6px 12px; border-radius: 10px; }
.modalRow { display: flex; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); font-size: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🐦 Flappy Score Challenge</h1>
  <div class="controls">
    <input id="name" maxlength="16" placeholder="Enter player name">
    <button id="start">START</button>
    <button id="restartBtn">🔄 RESTART</button>
    <button id="scoreBtn">🏆 SCORES</button>
  </div>
  <div class="timerBox">⏱️ TOTAL PLAYTIME: <span id="playtime">0m 0s</span></div>
  <div id="status">Enter your name and press START</div>

  <canvas id="game" width="540" height="640"></canvas>

  <div class="board">
    <h2>🏆 LIVE TOP 10 LEADERBOARD</h2>
    <div id="scores">Loading...</div>
    <div class="small">Checkpoints save every 50 pts • Press RESTART to reset your progress</div>
  </div>
</div>

<div id="scoreModal" class="modal">
  <div class="modalBox">
    <button id="closeScores" class="close">✕</button>
    <h2>🏆 LIVE SCOREBOARD</h2>
    <div id="gameScores">Loading...</div>
    <div class="small">Live • Permanent • Top 10</div>
  </div>
</div>
