<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flappy Score Challenge</title>
<style>
* { box-sizing: border-box; user-select: none; }
body {
  margin: 0; background: #0a0e17; color: #fff;
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; padding: 10px;
}
.wrap { width: min(540px, 100vw); text-align: center; display: flex; flex-direction: column; gap: 12px; }
h1 {
  margin: 4px 0 2px; font-size: 26px; font-weight: 800;
  background: linear-gradient(135deg, #ffd54a, #ff7100);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.controls { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
#name {
  flex: 1; min-width: 180px; padding: 12px 16px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.15); background: rgba(255, 255, 255, 0.07);
  color: #fff; font-size: 16px; outline: none;
}
button {
  padding: 12px 20px; border: none; border-radius: 12px;
  font-weight: 700; font-size: 15px; cursor: pointer;
}
#start { background: linear-gradient(135deg, #4caf50, #2e7d32); color: #fff; }
#scoreBtn { background: linear-gradient(135deg, #ff9800, #f57c00); color: #fff; }
#status { min-height: 24px; color: #ffd54a; font-weight: 600; font-size: 15px; }
.timerBox {
  font-size: 14px; font-weight: 700; color: #8ed8ff;
  background: rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 6px;
}
canvas {
  width: 100%; max-width: 540px; background: #8ed8ff; border-radius: 18px;
  display: block; margin: auto; touch-action: none;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
}
.board {
  background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 18px; padding: 16px; backdrop-filter: blur(12px);
}
.board h2 { margin: 0 0 12px; font-size: 18px; color: #ffd54a; }
.row { display: flex; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 15px; }
.small { font-size: 12px; color: #888; margin-top: 6px; }
.modal {
  display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
  z-index: 20; align-items: center; justify-content: center; padding: 20px;
}
.modalBox {
  position: relative; width: min(420px, 94vw); max-height: 80vh; overflow: auto;
  background: #141a26; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 20px;
}
.close { position: absolute; right: 12px; top: 12px; background: rgba(255, 255, 255, 0.1); color: #fff; padding: 6px 12px; border-radius: 10px; }
.modalRow { display: flex; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); font-size: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🐦 Flappy Score Challenge</h1>
  <div class="controls">
    <input id="name" maxlength="16" placeholder="Enter player name">
    <button id="start">START</button>
    <button id="scoreBtn">🏆 SCORES</button>
  </div>
  <div class="timerBox">⏱️ TOTAL PLAYTIME: <span id="playtime">0m 0s</span></div>
  <div id="status">Enter your name and press START</div>

  <canvas id="game" width="540" height="640"></canvas>

  <div class="board">
    <h2>🏆 LIVE TOP 10 LEADERBOARD</h2>
    <div id="scores">Loading...</div>
    <div class="small">Checkpoints save permanently • Timer tracks continuous playtime</div>
  </div>
</div>

<div id="scoreModal" class="modal">
  <div class="modalBox">
    <button id="closeScores" class="close">✕</button>
    <h2>🏆 LIVE SCOREBOARD</h2>
    <div id="gameScores">Loading...</div>
    <div class="small">Live • Permanent • Top 10</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, getDoc, query, orderBy, limit, onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDlWE6wObQCDDMxbfMrVt3Y6LtPoYJH4ag",
  authDomain: "flappy-bird021.firebaseapp.com",
  projectId: "flappy-bird021",
  storageBucket: "flappy-bird021.firebasestorage.app",
  messagingSenderId: "475117497436",
  appId: "1:475117497436:web:7463a452a5052093cc8a99",
  measurementId: "G-1MRK38DQPN"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Unique player ID
let playerId = localStorage.getItem("flappy_player_id");
if(!playerId){
  playerId = "player_" + Math.random().toString(36).substring(2, 11);
  localStorage.setItem("flappy_player_id", playerId);
}

// Persistent Checkpoint & Playtime setup
let checkpointScore = parseInt(localStorage.getItem("flappy_checkpoint")) || 0;
let totalPlayTime = parseInt(localStorage.getItem("flappy_playtime")) || 0; // stored in seconds

const playtimeElem = document.getElementById("playtime");
function updatePlaytimeDisplay(){
  const mins = Math.floor(totalPlayTime / 60);
  const secs = totalPlayTime % 60;
  playtimeElem.textContent = `${mins}m ${secs}s`;
}
updatePlaytimeDisplay();

// Playtime ticker interval
setInterval(() => {
  if (running) {
    totalPlayTime++;
    localStorage.setItem("flappy_playtime", totalPlayTime);
    updatePlaytimeDisplay();
  }
}, 1000);

const nameInput = document.getElementById("name");
const savedName = localStorage.getItem("flappy_player_name");
if(savedName){
  nameInput.value = savedName;
}

const board = document.getElementById("scores");
const gameScores = document.getElementById("gameScores");
const scoreQuery = query(collection(db, "scores"), orderBy("score", "desc"), limit(10));

onSnapshot(scoreQuery, snap => {
  if (snap.empty) {
    board.innerHTML = "<div>No scores yet — be the first!</div>";
    gameScores.innerHTML = "<div>No scores yet — be the first!</div>";
    return;
  }
  
  const listHtml = snap.docs.map((d, i) => {
    const x = d.data();
    return `<div class="row"><span>${i+1}. ${escapeHtml(x.name || "Player")}</span><b>${Number(x.score)||0}</b></div>`;
  }).join("");

  const modalHtml = snap.docs.map((d, i) => {
    const x = d.data();
    return `<div class="modalRow"><span>${i+1}. ${escapeHtml(x.name || "Player")}</span><b>${Number(x.score)||0}</b></div>`;
  }).join("");

  board.innerHTML = listHtml;
  gameScores.innerHTML = modalHtml;
}, err => {
  board.innerHTML = "<div>Leaderboard unavailable.</div>";
  gameScores.innerHTML = "<div>Leaderboard unavailable.</div>";
});

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

const c=document.getElementById("game"), ctx=c.getContext("2d");
const W=c.width,H=c.height;
let player, pipes=[], score=0, running=false, countdown=false, last=0, spawnTimer=0, name="";

function reset(){
  player = {x:125, y:H/2, vy:0, r:18};
  pipes = []; 
  spawnTimer = 0;
  score = checkpointScore; // Starts directly at saved checkpoint
}

function addPipe(){
  const early = score < 20;
  const gap = early ? 285 : Math.max(190, 285 - score * 0.30);
  const margin = 105;
  const center = margin + Math.random() * (H - margin * 2);
  pipes.push({x:W+100,w:78,gap,top:center-gap/2,passed:false});
}

function currentSpeed(){
  return 2.8 + Math.min(3.2, score * 0.035);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#7bd6ff");g.addColorStop(1,"#d8f6ff");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  ctx.fillStyle="rgba(255,255,255,.8)";
  [[80,80,35],[110,75,28],[400,120,40],[430,112,25]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()});

  ctx.fillStyle="rgba(91,190,105,.35)";
  ctx.beginPath();ctx.moveTo(0,H-95);
  for(let x=0;x<=W;x+=45) ctx.lineTo(x,H-95-(Math.sin(x*.025)*18+25));
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();

  pipes.forEach(p=>{
    const pipeGrad=ctx.createLinearGradient(p.x,0,p.x+p.w,0);
    pipeGrad.addColorStop(0,"#237c35");pipeGrad.addColorStop(.45,"#55c85c");pipeGrad.addColorStop(1,"#1d7130");
    ctx.fillStyle=pipeGrad;
    ctx.fillRect(p.x,0,p.w,p.top);
    ctx.fillRect(p.x,p.top+p.gap,p.w,H);

    ctx.fillStyle="#185b28";
    ctx.fillRect(p.x-7,p.top-15,p.w+14,15);
    ctx.fillRect(p.x-7,p.top+p.gap,p.w+14,15);
    ctx.fillStyle="rgba(255,255,255,.20)";
    ctx.fillRect(p.x+9,0,7,p.top);
    ctx.fillRect(p.x+9,p.top+p.gap+15,7,H);
  });

  ctx.fillStyle="#72b84b";ctx.fillRect(0,H-20,W,20);
  ctx.fillStyle="#d4b34c";ctx.fillRect(0,H-8,W,8);
  const birdGrad=ctx.createRadialGradient(player.x-5,player.y-7,3,player.x,player.y,22);
  birdGrad.addColorStop(0,"#fff58a");birdGrad.addColorStop(1,"#ffb900");
  ctx.fillStyle=birdGrad;ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f08a00";ctx.beginPath();ctx.ellipse(player.x-5,player.y+7,11,6,-.25,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(player.x+7,player.y-6,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#111";ctx.beginPath();ctx.arc(player.x+9,player.y-6,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ff7100";ctx.beginPath();ctx.moveTo(player.x+15,player.y);ctx.lineTo(player.x+31,player.y+6);ctx.lineTo(player.x+15,player.y+11);ctx.fill();

  ctx.fillStyle="#fff";ctx.strokeStyle="#000";ctx.lineWidth=4;ctx.font="bold 42px Arial";ctx.textAlign="center";
  ctx.strokeText(score,W/2,58);ctx.fillText(score,W/2,58);
  ctx.font="bold 14px Arial";ctx.fillStyle="rgba(0,0,0,.45)";
  ctx.fillText(`SPEED ${currentSpeed().toFixed(1)}`,W/2,82);
}

function flap(){ if(running) player.vy=-6.4; }

function gameOver(){
  if(!running)return;
  running=false;
  
  if (checkpointScore > 0) {
    document.getElementById("status").textContent = `Game Over! Restarting at Checkpoint ${checkpointScore}`;
  } else {
    document.getElementById("status").textContent = `Game over! ${name}: ${score}`;
  }
  
  saveScore();
}

async function saveScore(){
  if(score <= 0) return;
  try{
    const playerRef = doc(db, "scores", playerId);
    const docSnap = await getDoc(playerRef);

    if(!docSnap.exists() || score > docSnap.data().score){
      await setDoc(playerRef, {
        name: name.slice(0, 16),
        score: Number(score),
        createdAt: serverTimestamp()
      }, { merge: true });
      document.getElementById("status").textContent = `🎉 NEW PERSONAL BEST! ${name}: ${score}`;
    }
  }catch(e){
    console.error(e);
  }
}

function start(){
  const nameInput = document.getElementById("name");
  name = (nameInput.value.trim() || "Player").slice(0,16);
  localStorage.setItem("flappy_player_name", name);
  
  reset(); 
  countdown=true; running=
